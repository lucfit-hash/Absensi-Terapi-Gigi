html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1 1 140px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.sm{padding:4px 10px;font-size:13px}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.stu{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--bd)}
.stu:last-child{border:0}
.nm{flex:1 1 180px;min-width:0}.nm small{color:var(--mu);display:block}
.seg{display:flex;gap:4px}
.seg button{padding:5px 11px;font-size:13px;min-width:44px}
.seg button.on[data-s="H"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg button.on[data-s="I"]{background:var(--iz);color:#fff;border-color:var(--iz)}
.seg button.on[data-s="S"]{background:var(--sk);color:#fff;border-color:var(--sk)}
.seg button.on[data-s="A"]{background:var(--al);color:#fff;border-color:var(--al)}
.sum{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mu);margin:8px 0}
.sum b{color:var(--tx)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:center}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
.low{color:var(--al);font-weight:700}
.mu{color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}.card{border-color:#999}}
</style>

  function load(){try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}

      if(!S.done['c'+k]){S.done['c'+k]=1;PRE[k].forEach(function(c,i){if(!S.courses.some(function(x){return x.id==='p'+k+i}))S.courses.push({id:'p'+k+i,kelas:k,kode:c[0],nama:c[1],dosen:c[2],tempat:c[3],sessions:[]})})}});

    if(!S.kelas.RPL)S.kelas.RPL={students:[]};
    if(!cur()&&S.courses.length)S.cur=S.courses[0].id;

    var h='<div class="card"><div class="scroll"><table><thead><tr><th>NIM</th><th>Nama</th><th>H</th><th>I</th><th>S</th><th>A</th><th>% Hadir</th></tr></thead><tbody>';
    st.forEach(function(s){var r={H:0,I:0,S:0,A:0};
      c.sessions.forEach(function(x){r[x.att[s.nim]||'A']++});
      var p=Math.round(r.H/tot*100);
      h+='<tr><td>'+esc(s.nim)+'</td><td>'+esc(s.nama)+'</td><td>'+r.H+'</td><td>'+r.I+'</td><td>'+r.S+'</td><td>'+r.A+'</td><td class="'+(p<75?'low':'')+'">'+p+'%</td></tr>'});
    h+='</tbody></table></div><div class="mu" style="font-size:12px;margin-top:8px">Persentase dihitung dari '+tot+' pertemuan. Merah = di bawah 75%.</div><div class="actions noprint"><button onclick="window.print()">Cetak rekap</button></div></div>';
    h+='<div class="card noprint"><b>Riwayat pertemuan</b>'+c.sessions.slice().sort(function(a,b){return a.no-b.no}).map(function(x){return '<div class="stu"><div class="nm">Pertemuan '+x.no+' · '+fmtDate(x.date)+'<small>'+esc(x.dosen||'')+'</small></div><div><button class="sm" data-load="'+x.no+'">Ubah</button> <button class="sm" data-dels="'+x.no+'">Hapus</button></div></div>'}).join('')+'</div>';
    return h;
  }

  document.addEventListener('click',function(e){
    var t=e.target,c=cur();
    if(t.closest('.seg')&&t.dataset.s){form.att[t.closest('.seg').dataset.nim]=t.dataset.s;
      t.closest('.seg').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b===t)});$('sum').innerHTML=sumHtml();return}
    if(t.dataset.tab){tab=t.dataset.tab;render();return}
    if(t.dataset.act==='allH'){form.att={};render();return}
    if(t.dataset.act==='save'&&c){
      var no=parseInt(form.no,10);if(!no||no<1){alert('Isi nomor pertemuan.');return}
      var att={};studs(c).forEach(function(s){att[s.nim]=form.att[s.nim]||'H'});
      var ex=c.sessions.filter(function(x){return x.no===no})[0];
      if(ex){ex.date=form.date;ex.dosen=form.dosen;ex.att=att}else c.sessions.push({no:no,date:form.date,dosen:form.dosen,att:att});
      save();initForm();render();alert('Absensi pertemuan '+no+' tersimpan.');return}
    if(t.dataset.act==='addS'&&c){var st=studs(c);
      $('bulk').value.split('\n').forEach(function(l){var p=l.split(/[,;\t]/);if(p.length<2)return;
        var nim=p[0].trim(),nama=p.slice(1).join(',').trim();
        if(nim&&nama&&!st.some(function(s){return s.nim===nim}))st.push({nim:nim,nama:nama})});
      save();render();return}
    if(t.dataset.del&&c){S.kelas[c.kelas].students=studs(c).filter(function(s){return s.nim!==t.dataset.del});save();render();return}
    if(t.dataset.dels&&c){if(confirm('Hapus pertemuan ini?')){c.sessions=c.sessions.filter(function(x){return x.no!==+t.dataset.dels});save();initForm();render()}return}
    if(t.dataset.load&&c){var x=c.sessions.filter(function(y){return y.no===+t.dataset.load})[0];form={no:x.no,date:x.date,dosen:x.dosen||c.dosen[0]||'',att:JSON.parse(JSON.stringify(x.att))};tab='absen';render();return}
  });
  document.addEventListener('input',function(e){
    if(e.target.id==='fno')form.no=e.target.value;
    if(e.target.id==='fdt')form.date=e.target.value;
    if(e.target.id==='fds')form.dosen=e.target.value;
  });
  $('cs').addEventListener('change',function(e){S.cur=e.target.value;save();initForm();render()});
  $('addC').addEventListener('click',function(){$('newC').hidden=!$('newC').hidden});
  $('saveC').addEventListener('click',function(){
    var k=$('nk').value.trim(),n=$('nn').value.trim();
    if(!k||!n){alert('Kode dan nama mata kuliah wajib diisi.');return}
    var id='c'+Date.now();
    S.courses.push({id:id,kelas:$('nl').value,kode:k,nama:n,dosen:$('nd').value.split(';').map(function(x){return x.trim()}).filter(Boolean),tempat:'',sessions:[]});
    S.cur=id;save();['nk','nn','nd'].forEach(function(i){$(i).value=''});
    $('newC').hidden=true;tab='mhs';initForm();render()});
  $('delC').addEventListener('click',function(){var c=cur();if(!c)return;
    if(confirm('Hapus mata kuliah "'+c.nama+'" ('+KL[c.kelas]+') beserta data absensinya?')){S.courses=S.courses.filter(function(x){return x.id!==c.id});S.cur=S.courses[0]?S.courses[0].id:null;save();initForm();render()}});
  load();initForm();render();
})();
</script>
</body>
</html>
